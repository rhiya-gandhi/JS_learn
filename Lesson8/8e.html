<!DOCTYPE html>
<html>
    <head>
        <body>
            <script>
                function issameproduct(product1, product2) {
                    if (
                        product1.name === product2.name &&
                        product1.price === product2.price
                    ){
                        return true;
                    }else{
                        return false;
                    }
                }
                const product1 = {
                    name: 'basketball',
                    price: 2095
                };
                const product2 = {
                    name: 'football',
                    price: 1095
                };
                console.log(issameproduct(product1,product2));
            </script>
        </body>
    </head>
</html>
